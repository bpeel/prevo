apply plugin: 'com.android.application'

android {
    namespace = "uk.co.busydoingnothing.prevo"

    compileSdk = 34

    defaultConfig {
        applicationId = "uk.co.busydoingnothing.prevo"
        minSdk = 16
        targetSdk = 34
        versionCode = 27
        versionName = "0.27"
    }

   signingConfigs {
        release {
            storeFile = file(RELEASE_STORE_FILE)
            storePassword = RELEASE_STORE_PASSWORD
            keyAlias = RELEASE_KEY_ALIAS
            keyPassword = RELEASE_KEY_PASSWORD
        }
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}

def buildDictionary = tasks.register('buildDictionary', Exec) {
    outputs.dir 'src/main/assets/articles'
    outputs.dir 'src/main/assets/indices'
    outputs.file 'src/main/res/xml/languages.xml'

    commandLine rootProject.file('scripts/generate-dictionary.sh')
}

tasks.named('preBuild') {
    dependsOn buildDictionary
}
